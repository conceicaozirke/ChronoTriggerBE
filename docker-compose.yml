
services:
  mysql-db:
    image: mysql:8.0
    container_name: chronotrigger-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: RootRoot
      MYSQL_DATABASE: activity_tracker
      MYSQL_USER: Admin
      MYSQL_PASSWORD: AdminPassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: 